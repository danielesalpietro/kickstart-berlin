    # Topologia "single": un solo disco fisico. Sistema (EFI + root) e
    # Datastore Grastorp condividono lo stesso disco: __SYSTEM_PARTITION_SIZE__
    # per il root, il resto del disco al Datastore.
    #
    # "match" e' un allowlist per path in stile YAML flow (Autoinstall
    # configuration reference, sezione "Disk selection extensions": il
    # match spec "path" supporta il globbing; da Subiquity 24.08.1 il
    # campo "match" accetta anche una lista, provata in ordine finche'
    # una voce non trova un disco libero) invece del precedente
    # "match: {}" ("un disco arbitrario qualsiasi"). "match: {}" su
    # hardware con moduli Intel Optane Persistent Memory ha selezionato
    # un modulo PMem (/dev/pmem0, enumerato prima del disco reale
    # /dev/sda dall'ordine di probing del kernel) invece del disco vero
    # — mai emerso nei collaudi precedenti (VM Azure/Hyper-V/QEMU,
    # nessun Optane) prima del primo boot reale sulla Z8. Vedi Problema
    # 1 in logbook_first_boot.md.
    #
    # __SYSTEM_DISK_MATCH__: placeholder sostituito da scripts/build-iso.sh.
    # Default (nessun --disk-serial passato a build-iso.sh): allowlist
    # generico per path dei dischi "veri", **in quest'ordine di
    # preferenza**: SATA/SCSI, virtio, NVMe come ultima risorsa
    # (decisione 2026-08-24: riservare l'NVMe, piu' prezioso/performante,
    # al Datastore invece che "sprecarlo" sul boot - vedi
    # scripts/build-iso.sh per il dettaglio) - "/dev/pmem*" non compare
    # mai, quindi non puo' mai essere scelto per costruzione. NON basta
    # pero' su un nodo con PIU' dischi reali
    # candidabili (es. altri dischi con OS/dati preesistenti collegati,
    # scoperto sulla Z8 - vedi logbook_first_boot.md, sezione dischi
    # Windows): in quel caso build-iso.sh --disk-serial <serial> genera
    # invece un match per serial number esatto (deterministico,
    # ignora qualunque altro disco collegato), YAML flow style qui
    # per restare su una riga sola indipendentemente da quale dei due
    # casi si applica.
    swap:
      size: 0
    config:
      - type: disk
        id: system-disk
        match: __SYSTEM_DISK_MATCH__
        ptable: gpt
        wipe: superblock

      # Solo UEFI (decisione 2026-08-19, vedi logbook-fase2.md): niente
      # partizione BIOS Boot, "grub_device: true" solo sulla ESP sotto.
      # Il legacy BIOS non e' piu' supportato - l'hardware GPU target di
      # Vast.ai/Grastorp boota quasi universalmente UEFI, e curtin non
      # filtra i target grub_device in base alla modalita' firmware
      # effettiva: con il flag presente SIA sul disco SIA sulla ESP,
      # "grub-install" viene invocato su entrambi incondizionatamente,
      # e su un boot BIOS legacy il tentativo sulla ESP (FAT32) fallisce
      # sempre ("File system 'fat' doesn't support embedding... will not
      # proceed with blocklists"), mandando in errore l'intero autoinstall
      # - scoperto in un boot test QEMU reale in BIOS legacy del sandbox.
      #
      # "grub_device: true" qui: su un sistema UEFI Subiquity non
      # riconosce la ESP come partizione bootloader senza questo flag
      # esplicito sulla partizione stessa, e rifiuta l'intera config
      # PRIMA di iniziare il partizionamento con "autoinstall config did
      # not create needed bootloader partition" - scoperto in un boot
      # test Hyper-V reale (Gen2, sempre UEFI).
      - type: partition
        id: efi-partition
        device: system-disk
        size: 512M
        flag: boot
        grub_device: true

      - type: format
        id: efi-format
        volume: efi-partition
        fstype: fat32

      - type: mount
        id: efi-mount
        device: efi-format
        path: /boot/efi

      - type: partition
        id: root-partition
        device: system-disk
        size: __SYSTEM_PARTITION_SIZE__

      - type: format
        id: root-format
        volume: root-partition
        fstype: ext4

      - type: mount
        id: root-mount
        device: root-format
        path: /

      - type: partition
        id: datastore-partition
        device: system-disk
        size: -1

      - type: format
        id: datastore-format
        volume: datastore-partition
        fstype: __DATASTORE_FILESYSTEM__
        label: __DATASTORE_LABEL__
      # NOTA: nessuna azione "mount" qui per il Datastore. Il mountpoint
      # finale dipende dalla UUID che mkfs genera in questo stesso step,
      # non prevedibile staticamente in questo file: viene montato via
      # late-commands (stesso procedimento manuale documentato da Vast.ai
      # per il proprio /var/lib/docker: mkfs -> blkid -> fstab).
