    # Topologia "single": un solo disco fisico. Sistema (EFI + root) e
    # Datastore Grastorp condividono lo stesso disco: __SYSTEM_PARTITION_SIZE__
    # per il root, il resto del disco al Datastore.
    swap:
      size: 0
    config:
      - type: disk
        id: system-disk
        match: {}
        ptable: gpt
        wipe: superblock

      # Solo UEFI (decisione 2026-08-19, vedi logbook-fase2.md): niente
      # partizione BIOS Boot, "grub_device: true" solo sulla ESP sotto.
      # Il legacy BIOS non e' piu' supportato - l'hardware GPU target di
      # Vast.ai/Grastorp boota quasi universalmente UEFI, e curtin non
      # filtra i target grub_device in base alla modalita' firmware
      # effettiva: con il flag presente SIA sul disco SIA sulla ESP,
      # "grub-install" viene invocato su entrambi incondizionatamente,
      # e su un boot BIOS legacy il tentativo sulla ESP (FAT32) fallisce
      # sempre ("File system 'fat' doesn't support embedding... will not
      # proceed with blocklists"), mandando in errore l'intero autoinstall
      # - scoperto in un boot test QEMU reale in BIOS legacy del sandbox.
      #
      # "grub_device: true" qui: su un sistema UEFI Subiquity non
      # riconosce la ESP come partizione bootloader senza questo flag
      # esplicito sulla partizione stessa, e rifiuta l'intera config
      # PRIMA di iniziare il partizionamento con "autoinstall config did
      # not create needed bootloader partition" - scoperto in un boot
      # test Hyper-V reale (Gen2, sempre UEFI).
      - type: partition
        id: efi-partition
        device: system-disk
        size: 512M
        flag: boot
        grub_device: true

      - type: format
        id: efi-format
        volume: efi-partition
        fstype: fat32

      - type: mount
        id: efi-mount
        device: efi-format
        path: /boot/efi

      - type: partition
        id: root-partition
        device: system-disk
        size: __SYSTEM_PARTITION_SIZE__

      - type: format
        id: root-format
        volume: root-partition
        fstype: ext4

      - type: mount
        id: root-mount
        device: root-format
        path: /

      - type: partition
        id: datastore-partition
        device: system-disk
        size: -1

      - type: format
        id: datastore-format
        volume: datastore-partition
        fstype: __DATASTORE_FILESYSTEM__
        label: __DATASTORE_LABEL__
      # NOTA: nessuna azione "mount" qui per il Datastore. Il mountpoint
      # finale dipende dalla UUID che mkfs genera in questo stesso step,
      # non prevedibile staticamente in questo file: viene montato via
      # late-commands (stesso procedimento manuale documentato da Vast.ai
      # per il proprio /var/lib/docker: mkfs -> blkid -> fstab).
