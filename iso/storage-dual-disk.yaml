    # Topologia "dual": due dischi fisici. Sistema (EFI + root) sul disco
    # più piccolo (euristica: su un nodo GPU il disco boot è tipicamente
    # più piccolo dello storage dati; da riconfermare con test reali,
    # vedi logbook-fase1.md), Datastore Grastorp sull'altro disco intero.
    #
    # "size: smallest" esclude automaticamente il disco/chiavetta di
    # installazione (install-media) dal match, per costruzione della
    # feature - vedi Autoinstall configuration reference (Subiquity). La
    # seconda azione "disk" prende per esclusione l'unico disco rimasto
    # non ancora assegnato: se in fase di installazione risultasse un
    # solo disco reale disponibile, questa azione fallisce
    # l'installazione invece di procedere in modo scorretto (fail-fast
    # intenzionale: usare la topologia "single" in quel caso).
    #
    # "match" e' una lista ordinata di allowlist per path (path supporta
    # il globbing, "match" come lista e' supportato da Subiquity
    # 24.08.1, provata in ordine finche' una voce non trova un disco
    # libero) invece di un dict semplice ("match: {size: smallest}" /
    # "match: {}") — su hardware con moduli Intel Optane Persistent
    # Memory un match senza allowlist di path puo' selezionare un modulo
    # PMem (enumerato prima dei dischi reali dall'ordine di probing del
    # kernel) invece di un disco vero. Mai emerso nei collaudi precedenti
    # (VM senza Optane) prima del primo boot reale sulla Z8, stesso
    # problema di storage-single-disk.yaml — vedi Problema 1 in
    # logbook_first_boot.md. Limite noto: se il sistema avesse dischi
    # "veri" di bus diversi mescolati (es. un NVMe e un SATA) insieme,
    # "size: smallest" verrebbe applicato solo all'interno del primo bus
    # che matcha almeno un disco, non all'insieme di tutti - non un
    # problema per l'hardware target attuale (bus omogeneo).
    swap:
      size: 0
    config:
      - type: disk
        id: system-disk
        match:
          - path: /dev/nvme*n1
            size: smallest
          - path: /dev/sd*
            size: smallest
          - path: /dev/vd*
            size: smallest
        ptable: gpt
        wipe: superblock

      # Solo UEFI (decisione 2026-08-19): vedi storage-single-disk.yaml
      # per il dettaglio completo — niente partizione BIOS Boot,
      # "grub_device: true" solo sulla ESP sotto (necessario su UEFI,
      # senza Subiquity rifiuta l'intera config con "autoinstall config
      # did not create needed bootloader partition"; averlo anche sul
      # disco rompeva il boot BIOS legacy per un comportamento di curtin
      # che non filtra i target grub in base al firmware reale).
      - type: partition
        id: efi-partition
        device: system-disk
        size: 512M
        flag: boot
        grub_device: true

      - type: format
        id: efi-format
        volume: efi-partition
        fstype: fat32

      - type: mount
        id: efi-mount
        device: efi-format
        path: /boot/efi

      - type: partition
        id: root-partition
        device: system-disk
        size: -1

      - type: format
        id: root-format
        volume: root-partition
        fstype: ext4

      - type: mount
        id: root-mount
        device: root-format
        path: /

      - type: disk
        id: datastore-disk
        match:
          - path: /dev/nvme*n1
          - path: /dev/sd*
          - path: /dev/vd*
        ptable: gpt
        wipe: superblock

      - type: partition
        id: datastore-partition
        device: datastore-disk
        size: -1

      - type: format
        id: datastore-format
        volume: datastore-partition
        fstype: __DATASTORE_FILESYSTEM__
        label: __DATASTORE_LABEL__
      # NOTA: nessuna azione "mount" qui per il Datastore, stesso motivo
      # della topologia "single" — vedi storage-single-disk.yaml.
