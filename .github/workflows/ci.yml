name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: >-
          Esegui anche il boot test QEMU (build ISO reale da
          releases.ubuntu.com, download di alcuni GB + boot completo).
        type: boolean
        default: false

jobs:
  validate-autoinstall:
    name: Unit — valida autoinstall YAML e script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml shellcheck

      - name: Valida sintassi e struttura di iso/user-data
        run: python3 scripts/validate-autoinstall.py iso/user-data

      - name: Shellcheck sugli script di build/test e post-install
        run: shellcheck scripts/*.sh postinstall/*.sh

  build-and-boot-test:
    name: Integrazione — build ISO reale + boot QEMU/KVM (${{ matrix.disks }} disco/i)
    needs: validate-autoinstall
    runs-on: ubuntu-latest
    # Job pesante (download ISO ufficiale ~2-3GB + installazione completa in
    # QEMU): non gira su ogni PR, solo su push ai branch principali o su
    # richiesta esplicita via workflow_dispatch. Matrice sulle due topologie
    # dischi della Fase 2 (issue #2): scenario disco singolo e doppio disco,
    # come da piano di test dell'issue.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        disks: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze (xorriso, QEMU/KVM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso qemu-system-x86 qemu-utils

      - name: Abilita accesso KVM al runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM disponibile."
          else
            echo "KVM non disponibile su questo runner: si userà TCG (più lento)."
          fi

      - name: Genera keypair SSH di test
        run: ssh-keygen -t ed25519 -N "" -f "${{ runner.temp }}/test_key"

      - name: Costruisci ISO autoinstall (${{ matrix.disks }} disco/i)
        run: |
          # --system-size 10G: il default di produzione (100G, config/
          # autoinstall-defaults.json) non entrerebbe nel disco throwaway
          # da 20G di boot-test-qemu.sh. Rilevante solo per la topologia
          # single (--disks 1): con "dual" il root usa l'intero disco
          # dedicato (size:-1), il flag viene ignorato senza effetto.
          scripts/build-iso.sh \
            -k "${{ runner.temp }}/test_key.pub" \
            --disks "${{ matrix.disks }}" \
            --system-size 10G \
            -o "${{ runner.temp }}/kickstart-berlin-test.iso"

      - name: Boot ISO in QEMU, verifica autoinstall + login SSH + Datastore
        run: |
          scripts/boot-test-qemu.sh \
            -i "${{ runner.temp }}/kickstart-berlin-test.iso" \
            -k "${{ runner.temp }}/test_key" \
            --disks "${{ matrix.disks }}" \
            -t 2700
